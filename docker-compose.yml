# City dashboard: one container (the backend also serves the page).
#   docker compose up --build        -> http://localhost:8010
# The source folder is mounted, so code changes reload on their own and the app reads
# ./data/_dashboard (the copy from the cluster), ./cities.csv and ./config.json directly.
services:
  dashboard:
    build: .
    volumes:
      - .:/app
    ports:
      - "8010:8010"          # the labelling tool uses 8000, 5173 and 80
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      # This folder as WSL sees it, for the rsync command the app shows.
      # Empty when compose is started outside WSL: then config.json (pc_folder_wsl) is used.
      - DASHBOARD_HOST_DIR=${PWD:-}
    depends_on:
      - registry
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8010 --reload --reload-dir backend

  # Dataset registry, shown in the dashboard's "Datasets" tab (http://localhost:8010/registry/).
  # Its state is registry/registry-data/registry.json (+ history/): commit that folder.
  registry:
    build: ./registry
    environment:
      - BASE_PATH=/registry
      - DATA_ROOT=/project-data          # the "found on disk" check; remove to switch it off
    volumes:
      - ./registry/registry-data:/data
      - ./registry/seed:/seed:ro         # copied once, on first start, if registry-data/registry.json is missing
      - ${PROJECT_DATA:-../../urban-tree-detection/data}:/project-data:ro
    restart: unless-stopped
